error:
  cooldown: "You can't use this yet: %time%s left."
  inventory: "You need %amount% free inventory slots for this."
  citem: "You need %amount%x %id% for this."
  currency: "You need %amount% %id% for this."

# Added to an item's lore when it shows its cost / its trade's price.
# The "unmet" texts are shown when the player doesn't have enough.
cost: "§7Cost: §e%amount% %currency%"
cost-unmet: "§7Cost: §c%amount% %currency%"
price-header: "§7Price:"
price-entry: "§a %entry%"
price-entry-unmet: "§c %entry%"
# What a trade gives, when it is set to show that.
reward-header: "§7You get:"
reward-entry: "§e %entry%"

confirm:
  title: "Are you sure?"
  yes: "§aConfirm"
  no: "§cCancel"
